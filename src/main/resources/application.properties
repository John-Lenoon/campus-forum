spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:25432/forum}
spring.datasource.username=${DB_USER:forum}
spring.datasource.password=${DB_PASSWORD:Forum_local_123!}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=always
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:26479}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:25679}
spring.rabbitmq.username=${RABBIT_USER:forum}
spring.rabbitmq.password=${RABBIT_PASSWORD:Forum_local_123!}
spring.rabbitmq.connection-timeout=3s
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB
forum.storage-root=${MEDIA_ROOT:data/resources}
forum.ffmpeg=${FFMPEG_PATH:}

# SQL is isolated in typed MyBatis-Plus mapper interfaces and XML mappings.
mybatis-plus.mapper-locations=classpath:/mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.jdbc-type-for-null=NULL
mybatis-plus.global-config.banner=false
